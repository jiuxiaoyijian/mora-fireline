<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>火线街区 · UI 风格与层级提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e3d9;color:#3f382e;font:15px/1.5 "Microsoft YaHei",sans-serif}button,select{font:inherit;cursor:pointer}button{min-height:48px;border:1px solid #bca880;border-radius:9px;background:#fff5df;color:#453a2c;padding:8px 16px;box-shadow:0 2px 0 #c8b58d}button:hover{filter:brightness(1.04)}button:focus-visible,select:focus-visible{outline:3px solid #346953;outline-offset:3px}button[aria-pressed=true]{background:#dce3c7;border-color:#59734c}h1{font-size:22px;margin:0}header{max-width:1320px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}header p{margin:2px 0;color:#746b5c;font-size:13px}.options{display:flex;align-items:center;gap:10px}select{height:48px;padding:8px;border:1px solid #baa987;border-radius:8px;background:#fbf3e2}nav{max-width:1320px;margin:0 auto 12px;padding:0 24px;display:flex;gap:7px;flex-wrap:wrap}nav button{box-shadow:none;background:transparent;font-size:13px;min-height:40px;padding:4px 13px}.wrap{padding:0 20px;overflow:auto}.frame{--paper:#fff3d9;--ink:#453a2c;--wood:#b88952;--edge:#93663b;--green:#506746;position:relative;width:100%;max-width:1280px;height: min(70vh,720px);min-height:520px;margin:auto;overflow:hidden;border-radius:14px;box-shadow:0 12px 35px #4d50342b;container-type:inline-size;color:var(--ink);background:#c9d4c2}.frame.mobile{max-width:844px;height:390px;min-height:390px}.frame.paper{--wood:#e4d4af;--edge:#b9a275}.frame.navy{--paper:#223e4f;--ink:#eef0e5;--wood:#1d3544;--edge:#486171;--green:#986d2d}.scene{position:absolute;inset:0}.scene canvas{display:block;width:100%;height:100%}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#f4edd317,transparent 24%,transparent 80%,#4e5c3422)}.hud{position:absolute;inset:0;pointer-events:none}.hud>*{pointer-events:auto}.top{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;gap:16px;align-items:start}.s rong{display:block;font-size:16px}.note{max-width:1280px;margin:14px auto 24px;padding:0 20px;font-size:14px;color:#625a4c;display:flex;gap:30px}.note b{color:#465c3e}.note span{flex:1}.wood-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(490px,90%);border:9px solid var(--wood);outline:2px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:0 12px 24px #56412830;max-height:calc(100% - 32px);overflow:auto;padding:28px 34px;text-align:center}.wood-card h2{font:700 36px/1.2 Georgia,"Microsoft YaHei",serif;letter-spacing:2px;margin:12px 0 18px}.wood-card p{margin:10px 0}.wood-card .stamp{display:inline-block;border:2px solid #9f6239;border-radius:50%;padding:10px;color:#915832;transform:rotate(-10deg);font-size:13px}.eyebrow{font-size:12px;letter-spacing:3px;color:#856b47}.wood-card .primary,.sheet .primary{display:block;width:100%;background:var(--green);color:#fff6e0;border-color:#3c5333;margin-top:18px;font-weight:700}.wood-card .links{display:flex;gap:8px;margin-top:10px}.links button{flex:1;font-size:13px}.hero-shade{position:absolute;inset:0;background:#ede4c847;pointer-events:none}.score{font:700 48px/1.1 Georgia,serif;color:#526c41;margin:18px 0}.score small{font:16px sans-serif;color:#76684d}.result-grid{display:flex;justify-content:center;gap:24px;padding:12px 0;border-block:1px solid #cebd98}.report{position:absolute;top:16px;right:16px;bottom:16px;width:340px;background:var(--paper);color:var(--ink);padding:22px;border:3px solid var(--wood);box-shadow:0 4px 15px #59493025;overflow:auto;border-radius:10px}.report h2{margin:0 0 15px}.report button{display:block;width:100%;margin:9px 0;text-align:left}.report small{display:block}.report .primary{background:var(--green);color:#fff5df;text-align:center;margin-top:24px}.demo-badge{position:absolute;left:20px;bottom:0;font-size:10px;color:#3e4d36;background:#f9efd3a8;padding:0 5px}dialog{border:5px solid #b88e58;border-radius:12px;background:#fff @container(max-width:900px){.top{left:12px;right:12px;top:10px;gap:8px}.commission{min-width:174px;padding:5px 10px}.commission strong{font-size:15px}.resources{gap:6px}.resources .slip{padding:4px 9px;font-size:13px;min-height:48px}.resources b{font-size:19px}.wind{left:14px;top:69px;font-size:12px}.tray{left:12px;bottom:10px;padding:5px;gap:5px;border-width:2px;border-bottom-width:4px}.tray button{min-width:65px;padding:3px 9px;font-size:14px;min-height:48px}.main-action{right:12px;bottom:13px;min-width:125px;min-height:52px;font-size:15px}.hint{bottom:87px;left:14px;font-size:13px;max-width:310px;padding:4px 9px}.map-controls{right:12px;bottom:80px}.map-controls button{font-size:13px;min-height:48px;padding:5px 9px}.wood-card{padding:16px 25px;max-width:460px}.wood-card h2{font-size:28px;margin:8px}.wood-card p{font-size:14px;margin:7px}.wood-card .primary{margin-top:10px}.wood-card .stamp{display:none}.score{font-size:38px;margin:12px}.report{width:300px;top:10px;bottom:10px;padding:14px}.report h2{font-size:20px}.report p{font-size:14px}.report button{min-height:48px;margin:6px 0}.report .primary{margin-top:12px}.report small{font-size:12px}.playbar{bottom:12px}.watermark{display:none}.demo-badge{left:14px;font-size:9px}.mobile-supplement{display:none}}
@media(max-width:700px){header{padding:12px;display:block}header .options{margin-top:10px;flex-wrap:wrap}nav{padding:0 12px}.wrap{padding:0 8px}.frame{min-width:680px}.note{display:block}.note span{display:block;margin:8px 0}}
/* Keep touch targets at layout size, independently from the scene camera. */
button{min-width:48px}.playbar button[data-screen="paused"]{background:var(--green);color:#fff6e0}
@container(max-width:900px){.resources .mobile-supplement{display:none}.commission strong,.tray button,.main-action,.wood-card p,.report p{font-size:16px}.hint{font-size:16px;max-width:360px}.tray{gap:8px}}
</style></head><body>
<header><div><h1>火线街区 · 界面改版提案</h1><p>交互样稿 · 使用当前 3D 场景，数值为示例，未接入建造与模拟</p></div><div class="options"><select id="theme" aria-label="选择视觉风格"><option value="wood">浅木框＋暖纸张（推荐）</option><option value="paper">轻纸张</option><option value="navy">深蓝对照</option></select><button id="device">切换手游横屏</button></div></header>
<nav aria-label="查看界面"><button data-screen="title">标题 / 委托</button><button data-screen="build" aria-pressed="true">建造</button><button data-screen="warning">预警</button><button data-screen="running">演练</button><button data-screen="paused">暂停</button><button data-screen="outcome">结算</button><button data-screen="report">复盘</button><button data-sheet="menu">系统菜单</button><button data-sheet="help">帮助</button><button data-sheet="confirm">重置确认</button></nav>
<div class="wrap"><main class="frame" id="frame"><div id="scene" class="scene"></div><div id="hud" class="hud"></div></main></div>
<div class="note"><span><b>视觉方向</b> 木材只用于委托、结算和工具托盘；正文落在浅纸面，深色只用于文字和边缘。</span><span id="state-note"><b>建造</b> 保留目标、资源、工具与一个主行动；镜头与辅助图层按需展开。</span></div>
<dialog id="sheet" class="sheet"></dialog>
<script type="module">
import {GameView} from '/src/view.ts';
import {defaultLayout} from '/src/sim/model.ts';
const $=id=>document.getElementById(id);
const view=new GameView($('scene'),()=>{},()=>{}); view.setLayout(defaultLayout());
let last=performance.now();function frame(now){if(!document.hidden)view.update(null,Math.min(.05,(now-last)/1000));last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
let state='build', chosen='防火带';const notes={title:'一次说明身份与目标；进入局内后收起故事长文。',build:'保留目标、资源、工具与一个主行动；镜头与辅助图层按需展开。',warning:'短时提示风向与倒计时，准备期已建立目标，不再重复大段文字。',running:'收起建造工具和预算，把注意力交给山火；暂停与速度常驻。',paused:'明确火情停止，只保留继续与返回建造。',outcome:'一次呈现结果、差距和下步；详细事件在复盘展开。',report:'地图与线索并排，选择事件定位；不叠第二层结果弹窗。'};
const top=()=>`<div class="top"><button class="slip commission" data-sheet="mission"><small>松风镇 · ${state==='running'?'演练中':'防灾委托'}</small><strong>${state==='running'?'尚未起火 9 / 12 户':'目标：至少保住 8 户'}</strong></button><div class="resources">${state==='build'?'<div class="slip">预算 <b>12</b></div><div class="slip mobile-supplement">已安置 <b>12/12</b></div>':''}<button data-sheet="menu" aria-label="系统菜单">☰</button></div></div>`;
const card=(content)=>`<div class="hero-shade"></div><section class="wood-card">${content}</section>`;
function show(next){state=next;let html='';
 if(next==='title')html=card('<span class="eyebrow">松风镇巡护站</span><h2>火线街区</h2><p>他们已撤离，家园托付给你。</p><p>作为防灾规划员，用 12 点预算<br>保住至少 8 户，争取守住全部 12 户。</p><span class="stamp">值守委托<br>第 01 号</span><button class="primary" data-screen="build">接受委托，开始规划</button><div class="links"><button data-sheet="help">玩法说明</button><button data-sheet="menu">设置</button></div>');
 if(next==='build')html=top()+`<div class="wind">山火来向　西 → 东</div><div class="slip hint">${chosen} · ${chosen==='防火带'?'1 点/格，拖动可连续铺设':'点选地块，查看操作提示'}</div><div class="map-controls"><button data-sheet="layers">地图辅助</button><button data-sheet="camera">镜头</button></div><div class="tray">${['住宅','防火带','喷淋','拆除'].map((s,i)=>`<button data-tool="${s}" class="${chosen===s?'selected':''}" aria-pressed="${chosen===s}">${s}<small>${['可搬迁','1 点/格','4 点/座','返还预算'][i]}</small></button>`).join('')}<button data-sheet="undo" aria-label="撤销">↶</button></div><button class="main-action" data-screen="warning">开始演练 →</button>`;
 if(next==='warning')html=top()+card('<span class="eyebrow">防线演练即将开始</span><h2>山火自西侧逼近</h2><p>西 → 东</p><div class="score">3</div><button class="primary" data-screen="running">预览演练界面 →</button>');
 if(next==='running')html=top()+'<div class="wind">山火来向　西 → 东</div><div class="playbar slip"><div><strong>18 / 45 秒</strong><div class="timeline"></div></div><button data-screen="paused">暂停</button><button data-sheet="speed">1×</button><button data-screen="outcome">查看结果</button></div><div class="map-controls"><button data-sheet="layers">地图辅助</button></div>';
 if(next==='paused')html=card('<span class="eyebrow">火情与布局已保留</span><h2>演练已暂停</h2><button class="primary" data-screen="running">继续演练</button><div class="links"><button data-sheet="restart">返回建造</button><button data-sheet="menu">设置</button></div>');
 if(next==='outcome')html=card('<span class="eyebrow">本次演练报告</span><h2>已有 6 户家园守住</h2><div class="score">6 <small>/ 12 户</small></div><div class="result-grid"><span>距目标还差 <b>2 户</b></span><span>预算已用 <b>2 点</b></span></div><p>北侧防线有效，南侧仍需补强。</p><button class="primary" data-screen="build">保留布局，继续改进</button><div class="links"><button data-screen="report">查看起火线索</button></div>');
 if(next==='report')html='<div class="top"><button class="slip" data-screen="outcome">← 返回结果</button></div><section class="report"><span class="eyebrow">演练 01 · 线索示例</span><h2>下一处可以改哪里？</h2><p>保住 6 户，比上次多 6 户。</p><button data-sheet="event"><b>首起火：D5 · 4.0 秒</b><small>点选后定位到地图</small></button><button data-sheet="event"><b>南侧住宅受损</b><small>查看点燃来源</small></button><p>这是点燃当步的直接来源，<br>不代表完整火势因果链。</p><button class="primary" data-screen="build">去调整布局 →</button></section>';
 $('hud').innerHTML=html+'<span class="demo-badge">交互提案 · 示例数值</span>'; $('state-note').textContent=notes[next];document.querySelectorAll('nav [data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===next)));
}
const sheets={
 mission:'<h2>第 01 号 · 防灾委托</h2><p>居民已转移。请为返乡保住家园。</p><p><b>至少 8 户达标，12 户全部保住为完整守护。</b></p><p>现有预算 12 点。先规划，再用演练验证。</p>',
 menu:'<h2>巡护站菜单</h2><button data-sheet="help">玩法与操作</button><button data-sheet="settings">声音、画质与全屏</button><button data-sheet="confirm" class="danger">恢复默认布局</button><button data-screen="title">返回标题</button>',
 settings:'<h2>设置</h2><p>示例设置项；不修改实际游戏偏好。</p><button data-toggle>声音：关</button><button data-toggle>画质：标准</button><button data-toggle>全屏：关</button>',
 help:'<h2>三步守护家园</h2><p><b>1. 规划</b>　铺防火带或放喷淋，住宅可搬迁。</p><p><b>2. 验证</b>　草地可燃，喷淋只能预防起火。</p><p><b>3. 改进</b>　看结算线索，再改一处防线。</p><p>桌面：滚轮缩放、右键环视。<br>手游提案：单指建造，双指控制镜头；同时保留镜头按钮。</p>',
 layers:'<h2>地图辅助</h2><button data-layer="coverage">喷淋覆盖：关</button><button data-layer="grid">规划格线：关</button><button data-toggle>传播路径：关（复盘时使用）</button><button data-sheet="keyboard">键盘地图与辅助操作</button>',
 camera:'<h2>镜头</h2><div class="row"><button data-camera="in">拉近</button><button data-camera="out">拉远</button></div><div class="row"><button data-camera="up">俯视</button><button data-camera="down">低视角</button></div><button data-camera="reset">复位镜头</button>',
 confirm:'<h2>恢复默认布局？</h2><p>会替换当前布局，并清除本次成绩比较。此样稿不修改真实存档。</p><button class="danger" data-screen="build">恢复默认布局</button>',
 restart:'<h2>结束本次演练？</h2><p>布局保留，当前火情进度将放弃。</p><button data-screen="build">结束演练，返回建造</button>',
 undo:'<h2>撤销反馈示例</h2><p>已撤销上一处建造，预算返还。正式版使用短提示并保持工具栏位置。</p>',
 event:'<h2>事件定位示例</h2><p>正式版会高亮目标住宅和真实传播来源；关闭面板回到同一条线索，避免丢失上下文。</p>',
 speed:'<h2>演练速度</h2><button data-toggle>1× 标准</button><button data-toggle>2× 加速</button>',
 keyboard:'<h2>键盘地图</h2><p>保留现有无障碍网格入口。Tab 切换地块，Enter 操作；关闭返回原按钮。</p>'};
const layerState={grid:false,coverage:false};
function openSheet(name){$('sheet').innerHTML=(sheets[name]||'')+'<button class="quiet close" data-close>关闭 / 返回</button>'; $('sheet').querySelectorAll('[data-layer]').forEach(b=>{const on=layerState[b.dataset.layer];b.textContent=b.textContent.replace('关',on?'开':'关');b.setAttribute('aria-pressed',String(on))});if(!$('sheet').open)$('sheet').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){$('sheet').close();show(b.dataset.screen)}if(b.dataset.sheet)openSheet(b.dataset.sheet);if(b.hasAttribute('data-close'))$('sheet').close();if(b.dataset.tool){chosen=b.dataset.tool;show('build')}if(b.dataset.camera)view.adjustCamera(b.dataset.camera);if(b.hasAttribute('data-toggle')){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));if(/[开关]/.test(b.textContent))b.textContent=b.textContent.replace(/[开关]/,on?'开':'关');else if(/标准|流畅/.test(b.textContent)&&b.textContent.includes('画质'))b.textContent=b.textContent.replace(/标准|流畅/,on?'流畅':'标准')}if(b.dataset.layer){const on=!layerState[b.dataset.layer];layerState[b.dataset.layer]=on;b.setAttribute('aria-pressed',String(on));b.textContent=b.textContent.replace(on?'关':'开',on?'开':'关');if(b.dataset.layer==='grid')view.showGuides(on);if(b.dataset.layer==='coverage')view.coverage(on)}});
$('theme').onchange=e=>{$('frame').classList.remove('paper','navy');if(e.target.value!=='wood')$('frame').classList.add(e.target.value)};
$('device').onclick=()=>{const mobile=$('frame').classList.toggle('mobile');$('device').textContent=mobile?'切换桌面':'切换手游横屏'};
show('build');
</script></body></html>
